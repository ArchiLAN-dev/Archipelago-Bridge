name: Docker Publish

# Publie l'image sur GHCR. Jusqu'ici ce dépôt n'avait aucun workflow : les images étaient
# construites et poussées à la main, sans trace de quelle version contenait quoi, et sans scan.
# C'est ce qui a fait qu'aucune image de ce service n'existait pour la v0.17.0 du site alors que
# son code était mergé.
#
# Le site consomme ces images par version (`bridge_VERSION` dans son compose de prod), et
# `latest` pour certaines : les deux sont publiés, `latest` uniquement depuis `master`.
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: archilan-dev
  IMAGE: bridge

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Bridge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build image (load for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

      # NON BLOQUANT POUR L'INSTANT, et c'est un choix daté, pas un oubli.
      #
      # Mesuré le 2026-08-28 sur l'image archipelago : 78 vulnérabilités corrigeables en
      # HIGH/CRITICAL - 39 paquets Debian de l'image de base, 32 dans un binaire Go embarqué,
      # 2 CRITICAL (grpc v1.62.1, stdlib Go v1.23.7) que ni un `apt-get upgrade` ni notre code ne
      # peuvent corriger. Rendre le gate bloquant aujourd'hui empêcherait toute publication.
      #
      # Le rendre bloquant est suivi par une issue : c'est la seule façon d'éviter ce que le site a
      # vécu (#518), où un `continue-on-error` a masqué 29 findings dont un CRITICAL sur plusieurs
      # releases. Ici le scan tourne et son tableau est lisible dans le job ; il ne ment pas sur son
      # statut. `.trivyignore` existe déjà pour que la bascule ne demande que de changer exit-code.
      - name: Trivy scan (rapport)
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}
