name: Docker Publish

# Publie l'image sur GHCR. Jusqu'ici ce dépôt n'avait aucun workflow : les images étaient
# construites et poussées à la main, sans trace de quelle version contenait quoi, et sans scan.
# C'est ce qui a fait qu'aucune image de ce service n'existait pour la v0.17.0 du site alors que
# son code était mergé.
#
# Le site consomme ces images par version (`bridge_VERSION` dans son compose de prod), et
# `latest` pour certaines : les deux sont publiés, `latest` uniquement depuis `master`.
on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: archilan-dev
  IMAGE: bridge

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Bridge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build image (load for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

      # Bloquant, et place avant le push pour qu'une image vulnerable ne soit jamais publiee.
      # `ignore-unfixed: true` garde le gate honnete : il ne se declenche que sur des CVE sur
      # lesquelles on peut agir.
      #
      # Il ne l'etait pas a la creation de ce workflow : l'image portait des vulnerabilites
      # corrigeables et un gate aurait empeche toute publication. Elles ont ete traitees (montee des
      # dependances, retrait des arbres vendores), l'image est a zero, et le gate ferme la porte
      # derriere. L'echappatoire pour une publication urgente est une entree datee dans
      # `.trivyignore`, pas un `continue-on-error` - c'est ce masquage global qui avait laisse passer
      # 29 findings dont un CRITICAL cote site (#518).
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}
